name: Sunday NFL Prediction Pipeline

on:
  schedule:
    - cron: "0 13 * * 0"
    - cron: "40 16 * * 0"
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install nflreadpy pandas numpy scikit-learn joblib pyarrow requests

      - name: Build pregame features
        run: PYTHONPATH=src python src/build_features.py

      - name: Run Sunday predictions & update README
        if: github.event.schedule == '40 16 * * 0' || github.event_name == 'workflow_dispatch'
        run: |
          PYTHONPATH=src python src/predict_sunday.py
          PYTHONPATH=src python src/predict_players.py
          python src/update_readme.py

      - name: Commit updated predictions and README
        run: |
          git config user.name "nfl-predictor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ README.md
          git diff --staged --quiet || git commit -m "Update weekly NFL predictions and live README tables"
          git push